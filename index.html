      var V = dev ? '' : '?v=' + encodeURIComponent(BUILD);

          params.set('v', latest);
          location.replace(location.pathname + '?' + params.toString() + location.hash);

  <script>
    // Boot progress: counts the module files as they arrive (PerformanceObserver), then main.js reports the
    // remaining phases through window.ashvaleLoading(text, fraction).
    (function () {
      var EXPECTED = window.ASHVALE_EXPECTED || 130, seen = 0, done = false, fill = null, text = null;
      function els() { fill = fill || document.querySelector('#loading .loading-fill'); text = text || document.querySelector('#loading .loading-text'); }
      window.ashvaleLoading = function (msg, frac) {
        els();
        if (msg != null && text) text.textContent = msg;
        if (frac != null && fill) fill.style.width = Math.round(Math.max(0, Math.min(1, frac)) * 100) + '%';
        if (frac >= 1) done = true;
      };
      try {
        var counted = {};
        new PerformanceObserver(function (list) {
          if (done) return;
          list.getEntries().forEach(function (e) {
            if (!/\/src\/|three|peerjs/.test(e.name) || counted[e.name]) return;
            counted[e.name] = 1; seen++;
          });
          window.ashvaleLoading('Loading game files... (' + seen + ')', 0.85 * Math.min(1, seen / EXPECTED));
        }).observe({ type: 'resource', buffered: true });
      } catch (e) { /* old browser: text only */ }
    })();
  </script>
