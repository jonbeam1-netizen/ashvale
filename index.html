<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ashvale</title>
  <meta name="description" content="Ashvale - a browser adventure in a low-poly fantasy world.">
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
  <!-- PeerJS (global `Peer`) for the networking module in src/net/. -->
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js" defer></script>
</head>
<body>
  <div id="game-root">
    <div id="viewport"></div>
    <div id="overlays"></div>
    <div id="click-cross"></div>
    <div id="hover-text"></div>
    <div id="area-popup"></div>
    <div id="xp-drops"></div>
    <div id="hud-topright"></div>
    <div id="wild-level" style="display:none"></div>
    <div id="fps" style="display:none"></div>
    <div id="chatbox" class="panel"></div>
    <div id="sidepanel" class="panel"></div>
    <div id="interface-layer"></div>
    <div id="context-menu"></div>
    <div id="tooltip"></div>
    <div id="charcreate"></div>
    <div id="loading"><div class="loading-box"><div class="loading-title">Ashvale</div><div class="loading-bar"><div class="loading-fill"></div></div><div class="loading-text">Loading game files...</div><noscript>Ashvale needs JavaScript.</noscript></div></div>
  </div>
  <script>
    // Boot progress: counts the ES modules as they arrive (no build step, so ~125 small files), then main.js
    // reports the remaining phases through window.ashvaleLoading(text, fraction).
    (function () {
      var EXPECTED = 125, seen = 0, done = false, fill = null, text = null;
      function els() { fill = fill || document.querySelector('#loading .loading-fill'); text = text || document.querySelector('#loading .loading-text'); }
      window.ashvaleLoading = function (msg, frac) {
        els();
        if (msg != null && text) text.textContent = msg;
        if (frac != null && fill) fill.style.width = Math.round(Math.max(0, Math.min(1, frac)) * 100) + '%';
        if (frac >= 1) done = true;
      };
      try {
        new PerformanceObserver(function (list) {
          if (done) return;
          list.getEntries().forEach(function (e) { if (/\/src\/|three|peerjs/.test(e.name)) seen++; });
          window.ashvaleLoading('Loading game files... (' + seen + ')', 0.85 * Math.min(1, seen / EXPECTED));
        }).observe({ type: 'resource', buffered: true });
      } catch (e) { /* old browser: text only */ }
    })();
  </script>
  <script type="module" src="src/main.js"></script>
</body>
</html>
